const leads=L.map(r=>({id:r[0],name:r[1],company:r[2],source:r[3],stage:r[4],priority:r[5],owner:r[6],ack:r[7],created:ago(r[8]),last:ago(r[9]),follow:inD(r[10]),value:r[11],email:r[1].split(' ')[0].toLowerCase()+'@example.com'}));
const acts=[];leads.forEach(l=>{acts.push({id:'a'+acts.length,lead:l.id,type:'Created',text:'Lead created from '+l.source,who:'System',at:l.created});if(l.last)acts.push({id:'a'+acts.length,lead:l.id,type:'Call',text:'Logged call (manual record)',who:l.owner?mem(l.owner).name:'System',at:l.last})});
const pay=[['PR-1001','l5','Proposal deposit',5000,'USD','Pending',4,-2],['PR-1002','l9','Onboarding package',5400,'USD','Paid',20,-10],['PR-1003','l11','Retainer – Q4',3800,'EUR','Pending',6,3],['PR-1004','l3','Pilot project',7500,'USD','Failed',9,-4],['PR-1005','l4','Trial membership',900,'USD','Draft',1,7]].map(p=>({id:p[0],lead:p[1],desc:p[2],amt:p[3],cur:p[4],status:p[5],created:ago(p[6]*24),due:inD(p[7])}));
const integ=[{id:'wa',name:'WhatsApp Business',desc:'Messaging provider',status:'Not configured',sync:null,issue:'Requires a real Twilio webhook and verified provider credentials'},{id:'st',name:'Stripe',desc:'Payment workflows',status:'Not configured',sync:null,issue:'Requires Stripe test-mode API and verified webhook'},{id:'gc',name:'Google Calendar',desc:'Appointment sync',status:'Not configured',sync:null,issue:'Requires Google OAuth and calendar integration'},{id:'sl',name:'Slack',desc:'Team notifications',status:'Not configured',sync:null,issue:'Requires real provider setup'}];

const appts=[['p1','Proposal walkthrough','l5','m3',1.2],['p2','Discovery call','l12','m4',3.1],['p3','Contract review','l11','m2',-1.1]].map(a=>({id:a[0],title:a[1],lead:a[2],owner:a[3],start:inD(a[4]),end:new Date(+inD(a[4])+H),status:a[4]<0?'Completed':'Scheduled'}));
const cos=[...new Set(leads.map(l=>l.company))].map((n,i)=>({id:'co'+(i+1),name:n,website:'www.'+n.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+'.example',industry:['Services','Retail','Health','Logistics'][i%4],size:['1-10','11-50','51-200'][i%3],location:['Berlin','Austin','Lisbon','Toronto'][i%4],owner:leads.find(l=>l.company==n).owner,notes:'',archived:false}));
cos.push({id:'co'+(cos.length+1),name:'Summit Outfitters',website:'www.summit.example',industry:'Retail',size:'11-50',location:'Denver',owner:'m3',notes:'Prospect with no leads yet.',archived:false});
const contacts=leads.map((l,i)=>{const[f,...r]=l.name.split(' ');l.coid=cos.find(c=>c.name==l.company).id;l.cid='ct'+(i+1);return{id:l.cid,first:f,last:r.join(' '),email:l.email,phone:'+1 555 01'+(10+i),title:'Decision maker',company:l.coid,owner:l.owner,source:l.source,tags:'',notes:'',created:l.created,updated:l.created,archived:false}});
contacts.push({id:'ct99',first:'Dana',last:'Fischer',email:'dana@summit.example',phone:'',title:'Owner',company:cos[cos.length-1].id,owner:'m3',source:'Event',tags:'VIP',notes:'Met at a trade show. No lead yet.',created:ago(100),updated:ago(100),archived:false});
const opps=['l3','l4','l5','l8','l9','l10','l11'].map((id,i)=>{const l=leads.find(x=>x.id==id);return{id:'op'+(i+1),title:l.company+' – '+(l.stage=='Proposal'?'Service proposal':'Engagement'),cid:l.cid,coid:l.coid,lead:id,owner:l.owner,value:l.value,cur:'USD',stage:l.stage,prob:{New:10,Contacted:20,Qualified:40,Proposal:65,Won:100,Lost:0}[l.stage],close:inD(10+i*6),desc:'',loss:l.stage=='Lost'?'Chose a competitor':'',created:l.created,updated:l.created,archived:false}});
opps.push({id:'op8',title:'Summit seasonal order',cid:'ct99',coid:cos[cos.length-1].id,lead:null,owner:'m3',value:9000,cur:'USD',stage:'Qualified',prob:40,close:inD(25),desc:'Direct opportunity with no lead.',loss:'',created:ago(90),updated:ago(90),archived:false});
return{leads,acts,pay,integ,notifs,appts,contacts,companies:cos,opps}};
function mem(id){return TEAM.find(t=>t.id===id)}
let S=seed();
// Browser persistence is for local hackathon demonstrations only, not secure storage or a server database.
const STORE='ubm-demo-v5';
const CONFIG={ackMinutes:30,openLimit:5,idleHours:72,escalationLevels:3,roundRobin:0};
function saveDemo(){try{localStorage.setItem(STORE,JSON.stringify({data:S,team:TEAM,config:CONFIG,workspace:UI.ws}));}catch(e){console.warn('Demo persistence unavailable');}}
function restoreDemo(){try{const raw=localStorage.getItem(STORE);if(!raw)return;const v=JSON.parse(raw);if(!v||!v.data||!Array.isArray(v.data.leads))return;
S=v.data;const convert=(a,keys)=>a.forEach(x=>keys.forEach(k=>{if(x[k]){const d=new Date(x[k]);if(!isNaN(+d))x[k]=d;}}));
convert(S.leads,['created','last','follow','assignedAt','ackAt']);convert(S.acts,['at']);convert(S.pay,['created','due']);convert(S.appts,['start','end']);convert(S.opps,['created','updated','close']);convert(S.contacts,['created','updated']);convert(S.integ,['sync']);
if(Array.isArray(v.team))v.team.forEach(x=>{let m=TEAM.find(t=>t.id===x.id);if(m)Object.assign(m,x);else TEAM.push(x)});
if(v.config)Object.assign(CONFIG,v.config);if(v.workspace)UI.ws=v.workspace;
TEAM.forEach(t=>{if(!t.availability)t.availability=t.active?'Available':'Offline'});
S.leads.forEach(l=>{if(l.escalations==null)l.escalations=0;if(l.owner&&!l.assignedAt)l.assignedAt=l.created});
ownerOpts.splice(0,ownerOpts.length,['','Unassigned'],...TEAM.map(t=>[t.id,t.name]));
}catch(e){console.warn('Could not load saved demo state',e);}}
function validOwner(id,excludeLead){const m=mem(id);return !!m&&m.active&&!m.invited&&m.availability==='Available'&&S.leads.filter(l=>l.owner===id&&l.id!==excludeLead&&!CLOSED.includes(l.stage)).length<CONFIG.openLimit;}
function nextOwner(excludeLead,except){const eligible=TEAM.filter(t=>validOwner(t.id,excludeLead)&&t.id!==except&&t.role!=='Owner'&&t.role!=='Admin');if(!eligible.length)return null;const i=CONFIG.roundRobin%eligible.length;CONFIG.roundRobin++;return eligible[i].id;}
function autoAssign(id){const l=svc.lead(id);if(!l||l.owner)return;const pick=nextOwner(id);if(pick){svc.assign(id,pick,'Auto-assigned by available-capacity rotation');return;}const msg='No available employee with remaining capacity';if(l.exception!==msg){l.exception=msg;svc.log(id,'Assignment exception',msg+'; lead remains in recovery');}}
function processEscalations(){let changed=0;for(const l of S.leads){if(CLOSED.includes(l.stage)||!l.owner||l.ack)continue;const assigned=l.assignedAt||l.created;if((NOW-assigned)/60000<CONFIG.ackMinutes)continue;
const prev=l.owner,choice=nextOwner(l.id,prev);if(choice){svc.assign(l.id,choice,'Acknowledgement deadline exceeded');l.escalations=(l.escalations||0)+1;svc.log(l.id,'Escalation','Escalated from '+mem(prev).name+' to '+mem(choice).name+' (local demo simulation)');changed++;}else{const reason='Acknowledgement deadline exceeded; no eligible replacement';if(l.exception!==reason){l.exception=reason;svc.log(l.id,'Escalation exception',reason+' (demo)');changed++;}}}
return changed;}
const svc={lead:id=>S.leads.find(l=>l.id===id),
log(id,type,text){S.acts.unshift({id:'a'+crypto.randomUUID(),lead:id,type,text,who:mem(ME)?.name||'System',at:new Date()})},
assign(id,o,reason='Manual reassignment'){const l=svc.lead(id);if(!l)return false;if(o&&!validOwner(o,id)){toast('This member is unavailable or at the open-lead limit');return false}const old=l.owner;if(old===o)return true;l.owner=o||null;l.ack=false;l.ackAt=null;l.assignedAt=new Date();l.exception=null;svc.log(id,'Assignment',(old?mem(old)?.name:'Unassigned')+' → '+(o?mem(o)?.name:'Unassigned')+' · '+reason);return true},
stage(id,s){const l=svc.lead(id);const f=l.stage;if(f===s)return;l.stage=s;l.last=new Date();svc.log(id,'Stage change',f+' → '+s)},
ack(id){const l=svc.lead(id);if(!l||!l.owner)return false;l.ack=true;l.ackAt=new Date();l.last=new Date();l.exception=null;svc.log(id,'Acknowledgement','Acknowledgement recorded (demo; no customer message sent)');return true},
follow(id,d){const l=svc.lead(id);l.follow=new Date(d+'T09:00:00');svc.log(id,'Follow-up','Follow-up scheduled for '+fd(l.follow))},

create(d){const id='l'+crypto.randomUUID();S.leads.unshift({id,...d,stage:'New',ack:false,ackAt:null,assignedAt:d.owner?new Date():null,escalations:0,created:new Date(),last:null,follow:null,email:d.email});svc.log(id,'Created','Lead created · '+d.source);if(!d.owner)autoAssign(id);return id},
needs(l){const r=[];if(CLOSED.includes(l.stage))return r;const days=h=>Math.floor(h/24);
if(!l.owner)r.push('Unassigned for '+Math.max(0,Math.floor((NOW-l.created)/60000))+'m');else if(!l.ack){const minutes=Math.max(0,Math.floor((NOW-(l.assignedAt||l.created))/60000));r.push(minutes>=CONFIG.ackMinutes?'Acknowledgement overdue by '+(minutes-CONFIG.ackMinutes)+'m':'Awaiting acknowledgement · '+Math.max(0,CONFIG.ackMinutes-minutes)+'m left');}

const idle=(NOW-(l.last||l.created))/H;if(idle>CONFIG.idleHours)r.push('No activity for '+days(idle)+'d');if(l.escalations>0)r.push('Escalated '+l.escalations+' time(s)');if(l.exception)r.push(l.exception);return r}};
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bd=(t,c)=>`<span class="b ${c}">${esc(t)}</span>`;

document.addEventListener('keydown',e=>{if(e.key=='Escape'&&(UI.np||UI.nav)){UI.np=UI.nav=false;render()}});
document.addEventListener('submit',e=>{const id=e.target.id;if(id=='nl')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email||'');
if(id=='ap'){if(!f.title.trim()){$('#e-t').textContent='Title is required.';return}if(!f.date||f.e<=f.s){$('#e-r').textContent='Choose a date and an end time after the start.';return}S.appts.push({id:'p'+Date.now(),title:f.title.trim(),lead:f.lead,owner:f.owner,start:new Date(f.date+'T'+f.s),end:new Date(f.date+'T'+f.e),status:'Scheduled'});svc.log(f.lead,'Meeting','Appointment scheduled: '+f.title.trim());$('#dlg').close();toast('Appointment created (local demo)');render()}
else if(id=='ctf'){['first','last'].forEach(k=>{$('#e-'+k).textContent=f[k].trim()?'':'Required.'});const dup=ok&&S.contacts.some(c=>c.email.toLowerCase()==f.email.toLowerCase()&&c.id!=f.id);$('#e-ce').textContent=!ok?'Enter a valid email.':dup?'A contact with this email already exists.':'';if(!f.first.trim()||!f.last.trim()||!ok||dup)return;const d={first:f.first.trim(),last:f.last.trim(),email:f.email,phone:f.phone,title:f.title,company:f.company,owner:f.owner,source:f.source,tags:f.tags,notes:f.notes,updated:NOW};if(f.id)Object.assign(S.contacts.find(c=>c.id==f.id),d);else S.contacts.unshift({id:'ct'+Date.now(),...d,created:NOW,archived:false});$('#dlg').close();toast(f.id?'Contact updated':'Contact added');render()}
else if(id=='cof'){const nm=f.name.trim(),m=!nm?'Company name is required.':S.companies.some(c=>c.name.toLowerCase()==nm.toLowerCase()&&c.id!=f.id)?'A company with this name already exists.':'';$('#e-cn').textContent=m;if(m)return;const d={name:nm,website:f.website,industry:f.industry,size:f.size,location:f.location,owner:f.owner,notes:f.notes};if(f.id){Object.assign(S.companies.find(c=>c.id==f.id),d);S.leads.filter(l=>l.coid==f.id).forEach(l=>l.company=nm)}else S.companies.unshift({id:'co'+Date.now(),...d,archived:false});$('#dlg').close();toast(f.id?'Company updated':'Company added');render()}
else if(id=='opf'){const v=+f.value,er=!f.title.trim()?'Title is required.':!f.cid?'Choose a contact.':!(v>0)?'Value must be a positive number.':!f.close?'Choose an expected close date.':'';$('#e-op').textContent=er;if(er)return;const d={title:f.title.trim(),cid:f.cid,coid:f.coid,owner:f.owner||null,value:v,cur:f.cur,stage:f.stage,prob:Math.min(100,Math.max(0,+f.prob||0)),close:new Date(f.close+'T09:00:00'),desc:f.desc,updated:NOW};if(f.id)Object.assign(S.opps.find(o=>o.id==f.id),d);else S.opps.unshift({id:'op'+Date.now(),...d,lead:null,loss:'',created:NOW,archived:false});$('#dlg').close();toast(f.id?'Opportunity updated':'Opportunity created');render()}
else if(id=='inq'){const nm=f.name.trim(),m=f.message.trim();$('#e-in').textContent=nm?'':'Name is required.';$('#e-ie').textContent=ok?'':'Enter a valid email.';$('#e-im').textContent=m?'':'Please describe your request.';if(!nm||!ok||!m)return;const cn=f.company.trim();let c=S.contacts.find(x=>x.email.toLowerCase()==f.email.toLowerCase()),co=cn?S.companies.find(x=>x.name.toLowerCase()==cn.toLowerCase()):null;
if(cn&&!co){co={id:'co'+Date.now(),name:cn,website:'',industry:'Other',size:'1-10',location:'',owner:null,notes:'Created from a portal inquiry',archived:false};S.companies.unshift(co)}
if(!c){const[a,...r]=nm.split(' ');c={id:'ct'+Date.now(),first:a,last:r.join(' ')||'-',email:f.email,phone:f.phone,title:'',company:co?co.id:'',owner:null,source:'Website',tags:'',notes:'',created:NOW,updated:NOW,archived:false};S.contacts.unshift(c)}
const lid=svc.create({name:nm,email:f.email,company:co?co.name:coName(c.company),source:'Web inquiry',priority:'Medium',value:0,owner:null,cid:c.id,coid:co?co.id:c.company});S.acts[0].who='Customer (portal)';S.acts[0].text='Customer web inquiry'+(f.subject.trim()?' ('+f.subject.trim()+')':'')+': '+m;S.notifs.unshift({id:'n'+Date.now(),t:'New inquiry from '+nm,to:'#/leads/'+lid,read:false});UI.cust=f.email;toast('Inquiry received (demo). No email was sent.');render()}
else if(id=='su'){const e1=f.ws.trim()?'':'Required.',e2=f.name.trim()?'':'Required.',e3=ok?'':'Enter a valid email.',e4=f.pw.length<8?'Password must be at least 8 characters.':f.pw!=f.pw2?'Passwords do not match.':'';$('#e-sw').textContent=e1;$('#e-sn').textContent=e2;$('#e-se').textContent=e3;$('#e-sp').textContent=e4;if(e1||e2||e3||e4)return;UI.ws=f.ws.trim();const o=mem('m1');o.name=f.name.trim();o.email=f.email;ownerOpts[1][1]=o.name;enter('m1');toast('Demo workspace created and you are its Owner. Sample data is pre-loaded; nothing is stored on a server.')}
else if(id=='ia'){if(f.pw.length<8){$('#e-ip').textContent='Password must be at least 8 characters.';return}const m=mem(f.id);m.name=f.name.trim()||m.name;m.invited=false;ownerOpts.find(o=>o[0]==m.id)[1]=m.name;enter(m.id)}
else if(id=='iv'){if(!ok){$('#e-iv').textContent='Enter a valid email.';return}const m={id:'m'+(TEAM.length+1),email:f.email,name:f.name.trim()||f.email,role:f.role,active:true,r0:f.role,invited:true};TEAM.push(m);ownerOpts.push([m.id,m.name]);$('#dlg').close();toast('Invitation recorded (demo). No email was sent; use the demo invite link in the list.');render()}
else if(id=='au'){$('#e-em').textContent=ok?'':'Enter a valid email.';if(!ok)return;if(f.kind=='login'){if(!f.pw){$('#e-pw').textContent='Password is required.';return}const m=TEAM.find(t=>(t.email||t.name.split(' ')[0].toLowerCase()+'@brightline.example')==f.email.toLowerCase()&&t.active&&!t.invited);if(!m){$('#e-em').textContent='No demo account with this email. Use a Demo access button.';return}enter(m.id)}else{$('#au-m').textContent='Demo only: no reset email was sent.'}}});
window.addEventListener('hashchange',()=>{UI.nav=false;UI.np=false;render();scrollTo(0,0)});
restoreDemo();render();
// Demo-only interval. This is NOT a server scheduler and stops when the browser tab closes.
setInterval(()=>{if(!UI.sess||document.visibilityState!=='visible')return;NOW=new Date();const n=processEscalations();if(n){saveDemo();render();toast(n+' lead deadline event(s) evaluated in this browser demo')}else if((location.hash||'').startsWith('#/recovery')||(location.hash||'').startsWith('#/dashboard'))render();},15000);

</script></body></html>
