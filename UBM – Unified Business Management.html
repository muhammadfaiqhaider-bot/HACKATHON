<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UBM – Unified Business Management</title>
<style>
:root{--pri:#4f46e5;--priH:#4338ca;--bg:#f5f6f8;--sf:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--in:#1d4ed8;--inb:#dbeafe;--ind:#4338ca;--indb:#e0e7ff;--r:10px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--sf:#181c2e;--tx:#e8eaf3;--mu:#9aa3b8;--bd:#2a3047;--pri:#818cf8;--priH:#a5b4fc;--ok:#86efac;--okb:#14351f;--wn:#fcd34d;--wnb:#3a2c0b;--er:#fca5a5;--erb:#3d1618;--in:#93c5fd;--inb:#14284a;--ind:#c7d2fe;--indb:#25285a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.shell{display:flex;min-height:100vh}
aside{width:236px;background:var(--sf);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:width .15s}
.col aside{width:68px}.col .lbl,.col .grp{display:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;font-weight:700}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:14px 10px 4px}
nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--mu);font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--indb);color:var(--ind);font-weight:600}
.ic{width:18px;text-align:center;flex:none}
.main{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.sr{position:relative;flex:1;max-width:420px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;min-height:36px;max-width:100%}
.sr input{width:100%}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;font-weight:500}
.btn:hover{background:var(--bg)}.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--priH)}
.btn.s{padding:3px 9px;min-height:28px;font-size:13px}
.pop{position:absolute;top:42px;right:0;left:auto;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 8px 24px #0002;min-width:300px;max-width:92vw;z-index:20;padding:6px}
.sr .pop{left:0;right:auto;width:100%}
.pop a,.pop div.it{display:block;padding:8px 10px;border-radius:6px}.pop a:hover{background:var(--bg)}
.pg{padding:20px;max-width:1280px;margin:0 auto}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mu);margin:2px 0 16px}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{display:block}.kpi:hover{border-color:var(--pri)}.kpi .v{font-size:26px;font-weight:700}.kpi .l{color:var(--mu);font-size:13px}.kpi small{color:var(--mu)}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b::before{content:"● ";font-size:8px;vertical-align:1px}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--wnb);color:var(--wn)}.err{background:var(--erb);color:var(--er)}.info{background:var(--inb);color:var(--in)}.ind{background:var(--indb);color:var(--ind)}.mut{background:var(--bg);color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:last-child td{border-bottom:0}
tr.hl td:first-child{box-shadow:inset 3px 0 var(--wn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--indb);color:var(--ind);font-size:11px;font-weight:700;margin-right:6px}
.muted{color:var(--mu)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--pri)}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:8px 0 8px 14px;border-left:2px solid var(--bd);position:relative}.tl li::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kc{background:var(--bg);border-radius:var(--r);padding:10px}.kc .card{margin-top:8px;padding:10px}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
.fe{color:var(--er);font-size:12px}.note{background:var(--inb);color:var(--in);padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(480px,94vw);padding:20px}dialog::backdrop{background:#0006}
dialog label{display:block;margin-top:10px;font-weight:500}dialog input,dialog select,dialog textarea{width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;z-index:50}
.menu{display:none}.dense td{padding:4px 10px}.au{max-width:380px;margin:8vh auto}.au label{display:block;margin-top:10px}
@media(max-width:820px){aside{position:fixed;z-index:30;left:-260px;width:240px;transition:left .15s}.nav aside{left:0;box-shadow:0 0 0 100vmax #0006}.col aside{width:240px}.col .lbl,.col .grp{display:revert}.menu{display:inline-block}.dcol{display:none}.pg{padding:14px}header{padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
// ---------- constants & types-by-convention ----------
const NOW=new Date('2026-10-18T09:00:00'),H=36e5,D=24*H;
const ago=h=>h==null?null:new Date(NOW-h*H),inD=n=>n==null?null:new Date(+NOW+n*D);
const fd=d=>d?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—';
const rel=d=>{if(!d)return'never';const h=Math.round((NOW-d)/H);return h<1?'just now':h<48?h+'h ago':Math.round(h/24)+'d ago'};
const STAGES=['New','Contacted','Qualified','Proposal','Won','Lost'],PRI=['High','Medium','Low'],SRC=['Website','Referral','WhatsApp','Event','Cold outreach'];
const CLOSED=['Won','Lost'],ME='m1';
const TEAM=[{id:'m1',name:'Amara Khan',role:'Admin'},{id:'m2',name:'Daniel Ortiz',role:'Manager'},{id:'m3',name:'Priya Nair',role:'Sales Rep'},{id:'m4',name:'Tom Becker',role:'Sales Rep'}].map(t=>({...t,active:true,r0:t.role}));
const SC={New:'info',Contacted:'info',Qualified:'ind',Proposal:'warn',Won:'ok',Lost:'err'};
const NAV=[['Overview',[['dashboard','Dashboard','▦']]],['Customers',[['contacts','Contacts','☺'],['companies','Companies','▣']]],['Sales',[['leads','Leads','◎'],['recovery','Recovery Queue','⚑'],['pipeline','Pipeline','☰']]],['Operations',[['activities','Activities','↻'],['calendar','Calendar','▤']]],['Finance',[['payments','Payments','$']]],['Administration',[['integrations','Integrations','⚙'],['team','Team & Access','♟'],['settings','Settings','✎']]]];
// ---------- mock data + service layer (swap for API calls later) ----------
const seed=()=>{const L=[['l1','Hana Mori','Brightwave Studio','Website','New','High',null,false,70,null,null,8400],['l2','Luis Duarte','Northfield Dental','Referral','New','Medium','m3',false,52,null,-1,3200],['l3','Grace Okafor','Okafor Logistics','WhatsApp','Contacted','High','m2',true,200,96,-3,15000],['l4','Ethan Park','Parkside Fitness','Website','Qualified','Medium','m4',true,300,30,2,6500],['l5','Sofia Lindqvist','Lindqvist Interiors','Event','Proposal','High','m3',true,400,20,1,22000],['l6','Marcus Hill','Hill & Co Accounting','Referral','Contacted','Low','m4',true,240,220,null,2800],['l7','Aisha Rahman','Rahman Textiles','Website','New','High',null,false,20,null,null,11000],['l8','Jonas Weber','Weber Bikes','Cold outreach','Qualified','Medium','m2',true,180,10,5,4900],['l9','Nina Petrova','Petrova Bakery','Event','Won','Medium','m3',true,600,100,null,5400],['l10','Omar Said','Said Auto Care','WhatsApp','Lost','Low','m4',true,700,500,null,1800],['l11','Chloe Martin','Martin Legal','Referral','Proposal','High','m2',true,350,60,-2,18500],['l12','Ravi Menon','Menon Clinics','Website','New','Medium','m4',false,30,null,3,7200]];
const leads=L.map(r=>({id:r[0],name:r[1],company:r[2],source:r[3],stage:r[4],priority:r[5],owner:r[6],ack:r[7],created:ago(r[8]),last:ago(r[9]),follow:inD(r[10]),value:r[11],email:r[1].split(' ')[0].toLowerCase()+'@example.com'}));
const acts=[];leads.forEach(l=>{acts.push({id:'a'+acts.length,lead:l.id,type:'Created',text:'Lead created from '+l.source,who:'System',at:l.created});if(l.last)acts.push({id:'a'+acts.length,lead:l.id,type:'Call',text:'Logged call (manual record)',who:l.owner?mem(l.owner).name:'System',at:l.last})});
const pay=[['PR-1001','l5','Proposal deposit',5000,'USD','Pending',4,-2],['PR-1002','l9','Onboarding package',5400,'USD','Paid',20,-10],['PR-1003','l11','Retainer – Q4',3800,'EUR','Pending',6,3],['PR-1004','l3','Pilot project',7500,'USD','Failed',9,-4],['PR-1005','l4','Trial membership',900,'USD','Draft',1,7]].map(p=>({id:p[0],lead:p[1],desc:p[2],amt:p[3],cur:p[4],status:p[5],created:ago(p[6]*24),due:inD(p[7])}));
const integ=[{id:'wa',name:'WhatsApp Business',desc:'Messaging provider',status:'Connected',sync:ago(2),issue:null},{id:'st',name:'Stripe',desc:'Payment workflows',status:'Attention required',sync:ago(30),issue:'Webhook signature check pending'},{id:'gc',name:'Google Calendar',desc:'Appointment sync',status:'Disconnected',sync:ago(120),issue:'Authorization expired'},{id:'sl',name:'Slack',desc:'Team notifications',status:'Not configured',sync:null,issue:null}];
const notifs=[{id:'n1',t:'Lead assigned: Luis Duarte',to:'#/leads/l2',read:false},{id:'n2',t:'Follow-up overdue: Grace Okafor',to:'#/leads/l3',read:false},{id:'n3',t:'Integration issue: Google Calendar',to:'#/integrations',read:false},{id:'n4',t:'Payment PR-1004 failed',to:'#/payments',read:true}];
const appts=[['p1','Proposal walkthrough','l5','m3',1.2],['p2','Discovery call','l12','m4',3.1],['p3','Contract review','l11','m2',-1.1]].map(a=>({id:a[0],title:a[1],lead:a[2],owner:a[3],start:inD(a[4]),end:new Date(+inD(a[4])+H),status:a[4]<0?'Completed':'Scheduled'}));
return{leads,acts,pay,integ,notifs,appts}};
function mem(id){return TEAM.find(t=>t.id===id)}
let S=seed();
const svc={lead:id=>S.leads.find(l=>l.id===id),
log(id,type,text){S.acts.unshift({id:'a'+Date.now()+Math.random(),lead:id,type,text,who:mem(ME).name,at:NOW})},
assign(id,o){const l=svc.lead(id);l.owner=o||null;l.ack=false;svc.log(id,'Assignment',o?'Assigned to '+mem(o).name:'Unassigned')},
stage(id,s){const l=svc.lead(id);const f=l.stage;l.stage=s;l.last=NOW;svc.log(id,'Stage change',f+' → '+s)},
ack(id){const l=svc.lead(id);l.ack=true;l.last=NOW;svc.log(id,'Acknowledgement','Acknowledgement recorded (no message was sent)')},
follow(id,d){const l=svc.lead(id);l.follow=new Date(d+'T09:00:00');svc.log(id,'Follow-up','Follow-up scheduled for '+fd(l.follow))},
note(id,t){svc.lead(id).last=NOW;svc.log(id,'Note',t)},
create(d){const id='l'+(S.leads.length+1);S.leads.unshift({id,...d,stage:'New',ack:false,created:NOW,last:null,follow:null,email:d.email});svc.log(id,'Created','Lead created manually');return id},
needs(l){const r=[];if(CLOSED.includes(l.stage))return r;const days=h=>Math.floor(h/24);
if(!l.owner)r.push('Unassigned for '+days((NOW-l.created)/H)+'d');else if(!l.ack)r.push('Awaiting acknowledgement');
if(l.follow&&l.follow<NOW)r.push('Follow-up overdue by '+Math.ceil((NOW-l.follow)/D)+'d');
const idle=(NOW-(l.last||l.created))/H;if(idle>168)r.push('No activity for '+days(idle)+'d');return r}};
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bd=(t,c)=>`<span class="b ${c}">${esc(t)}</span>`;
const own=id=>id?`<span class="av" aria-hidden="true">${mem(id).name.split(' ').map(w=>w[0]).join('')}</span>${esc(mem(id).name)}`:bd('Unassigned','err');
const ackB=l=>!l.owner?bd('Not assigned','err'):l.ack?bd('Acknowledged','ok'):bd('Awaiting ack','warn');
const fuB=l=>!l.follow?'<span class="muted">—</span>':(l.follow<NOW&&!CLOSED.includes(l.stage))?bd('Overdue · '+fd(l.follow),'err'):bd(fd(l.follow),'mut');
const money=(n,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c,maximumFractionDigits:0}).format(n);
const sel=(name,opts,val,extra='')=>`<select ${extra} aria-label="${name}">${opts.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${v==val?' selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const ownerOpts=[['', 'Unassigned'],...TEAM.map(t=>[t.id,t.name])];
const empty=(t,a='')=>`<div class="empty"><p>${t}</p>${a}</div>`;
let UI={role:'Admin',dense:false,nt:{assign:true,follow:true,integ:true},col:false,nav:false,pg:1,np:false,F:{q:'',stage:'',owner:'',ack:'',sort:'created'},pf:'',af:''};
function toast(m){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
// ---------- views ----------
const ph=(t,s,a='')=>`<div class="ph"><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="row">${a}</div></div>`;
function dashboard(){const L=S.leads,open=L.filter(l=>!CLOSED.includes(l.stage)),won=L.filter(l=>l.stage=='Won').length,need=L.filter(l=>svc.needs(l).length),od=open.filter(l=>l.follow&&l.follow<NOW).length;
const out={};S.pay.filter(p=>p.status=='Pending').forEach(p=>out[p.cur]=(out[p.cur]||0)+p.amt);
const k=(h,l,v,s)=>`<a class="card kpi" href="${h}"><div class="l">${l}</div><div class="v">${v}</div><small>${s}</small></a>`;
const mx=Math.max(...STAGES.map(s=>L.filter(l=>l.stage==s).length));
return ph('Business Overview','Live view of the demo workspace · dataset as of '+fd(NOW),`<button class="btn p" data-a="newlead">+ New lead</button>`)+
`<div class="grid k">${k('#/leads','Total leads',L.length,'all stages')}${k('#/leads','New leads',L.filter(l=>l.stage=='New').length,'in stage New')}${k('#/pipeline','Open opportunities',open.length,money(open.reduce((a,l)=>a+l.value,0))+' open value')}${k('#/pipeline','Conversion rate',Math.round(won/L.length*100)+'%',won+' won of '+L.length)}${k('#/recovery','Overdue follow-ups',od,'open leads')}${k('#/payments','Outstanding payments',Object.entries(out).map(([c,v])=>money(v,c)).join(' · ')||'—','pending, by currency')}</div>
<div class="grid two" style="margin-top:14px"><section class="card"><h2>Needs attention (${need.length})</h2>${need.length?need.slice(0,5).map(l=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><a href="#/leads/${l.id}"><b>${esc(l.name)}</b><br><small class="muted">${esc(svc.needs(l).join(' · '))}</small></a></div>`).join('')+`<p><a class="btn s" href="#/recovery">Open recovery queue →</a></p>`:empty('Nothing needs attention.')}</section>
<section class="card"><h2>Pipeline by stage</h2>${STAGES.map(s=>{const n=L.filter(l=>l.stage==s);return`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${s} · ${n.length}</span><span class="muted">${money(n.reduce((a,l)=>a+l.value,0))}</span></div><div class="pb" role="img" aria-label="${s}: ${n.length} leads"><i style="width:${n.length/mx*100}%"></i></div></div>`}).join('')}</section>
<section class="card"><h2>Recent activity</h2><ul class="tl">${tl(S.acts.slice(0,6),true)}</ul></section>
<section class="card"><h2>Integration health</h2>${S.integ.map(i=>`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${i.name}</span>${bd(i.status,iC(i.status))}</div>`).join('')}<p><a class="btn s" href="#/integrations">Review integrations →</a></p></section></div>`}
const iC=s=>({Connected:'ok',Syncing:'info',Connecting:'info','Attention required':'warn',Error:'err',Disconnected:'err','Not configured':'mut'}[s]);
const tl=(a,link)=>a.length?a.map(x=>{const l=svc.lead(x.lead);return`<li><b>${esc(x.type)}</b> · ${esc(x.text)}<br><small class="muted">${link&&l?`<a href="#/leads/${l.id}">${esc(l.name)}</a> · `:''}${esc(x.who)} · ${rel(x.at)}</small></li>`}).join(''):'<li>No activity yet.</li>';
function filtered(){const F=UI.F;let r=S.leads.filter(l=>(!F.q||(l.name+l.company).toLowerCase().includes(F.q.toLowerCase()))&&(!F.stage||l.stage==F.stage)&&(!F.owner||(F.owner=='none'?!l.owner:l.owner==F.owner))&&(!F.ack||(F.ack=='un'?!l.owner:F.ack=='aw'?l.owner&&!l.ack:l.ack)));
const k={created:(a,b)=>b.created-a.created,name:(a,b)=>a.name.localeCompare(b.name),value:(a,b)=>b.value-a.value,follow:(a,b)=>(a.follow||1e15)-(b.follow||1e15)};return r.sort(k[F.sort])}
function leadRows(){const r=filtered(),PS=8,pages=Math.max(1,Math.ceil(r.length/PS));UI.pg=Math.min(UI.pg,pages);const v=r.slice((UI.pg-1)*PS,UI.pg*PS);
if(!r.length)return empty('No leads match these filters.','<button class="btn" data-a="clear">Clear filters</button>');
return`<p class="muted" aria-live="polite">${r.length} of ${S.leads.length} leads</p><div class="tw"><table><thead><tr><th>Lead</th><th>Stage</th><th>Priority</th><th>Owner</th><th>Acknowledgement</th><th>Next follow-up</th><th>Last contact</th></tr></thead><tbody>${v.map(l=>`<tr class="${svc.needs(l).length?'hl':''}"><td><a href="#/leads/${l.id}"><b>${esc(l.name)}</b></a><br><small class="muted">${esc(l.company)} · ${esc(l.source)}</small></td><td>${bd(l.stage,SC[l.stage])}</td><td>${l.priority}</td><td>${own(l.owner)}</td><td>${ackB(l)}</td><td>${fuB(l)}</td><td>${rel(l.last)}</td></tr>`).join('')}</tbody></table></div>
<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn s" data-a="pg" data-v="${UI.pg-1}" ${UI.pg<2?'disabled':''}>‹ Prev</button><span>Page ${UI.pg} / ${pages}</span><button class="btn s" data-a="pg" data-v="${UI.pg+1}" ${UI.pg>=pages?'disabled':''}>Next ›</button></div>`}
function leads(){const F=UI.F;return ph('Leads','Assignment, acknowledgement and follow-up are tracked separately from sales stage.','<button class="btn p" data-a="newlead">+ New lead</button>')+
`<div class="bar"><input data-q="q" placeholder="Search leads" aria-label="Search leads" value="${esc(F.q)}">${sel('Stage',[['','All stages'],...STAGES],F.stage,'data-c="stage"')}${sel('Owner',[['','All owners'],['none','Unassigned'],...TEAM.map(t=>[t.id,t.name])],F.owner,'data-c="owner"')}${sel('Acknowledgement',[['','Any acknowledgement'],['un','Unassigned'],['aw','Awaiting ack'],['ak','Acknowledged']],F.ack,'data-c="ack"')}${sel('Sort',[['created','Newest'],['name','Name'],['value','Value'],['follow','Next follow-up']],F.sort,'data-c="sort"')}<button class="btn" data-a="clear">Clear</button></div><div class="card" id="area">${leadRows()}</div>`}

document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q=='q'){UI.F.q=t.value;UI.pg=1;$('#area').innerHTML=leadRows()}else if(t.dataset.q=='cq'){UI.cq=t.value;$('#carea').innerHTML=crows()}
if(t.id=='gs'){const q=t.value.trim().toLowerCase(),b=$('#gsr');if(!q){b.hidden=true;return}const r=S.leads.filter(l=>(l.name+l.company).toLowerCase().includes(q)).slice(0,6);b.hidden=false;b.innerHTML=r.length?r.map(l=>`<a href="#/leads/${l.id}">${esc(l.name)} <span class="muted">· Lead · ${esc(l.company)}</span></a>`).join(''):'<div class="it muted">No results. Try a name or company.</div>'}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&(UI.np||UI.nav)){UI.np=UI.nav=false;render()}});
document.addEventListener('submit',e=>{const id=e.target.id;if(id=='nl')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email||'');
if(id=='ap'){if(!f.title.trim()){$('#e-t').textContent='Title is required.';return}if(!f.date||f.e<=f.s){$('#e-r').textContent='Choose a date and an end time after the start.';return}S.appts.push({id:'p'+Date.now(),title:f.title.trim(),lead:f.lead,owner:f.owner,start:new Date(f.date+'T'+f.s),end:new Date(f.date+'T'+f.e),status:'Scheduled'});svc.log(f.lead,'Meeting','Appointment scheduled: '+f.title.trim());$('#dlg').close();toast('Appointment created (local demo)');render()}
else if(id=='iv'){if(!ok){$('#e-iv').textContent='Enter a valid email.';return}const m={id:'m'+(TEAM.length+1),name:f.name.trim()||f.email,role:f.role,active:true,r0:f.role,invited:true};TEAM.push(m);ownerOpts.push([m.id,m.name]);$('#dlg').close();toast('Member added locally. No email was sent.');render()}
else if(id=='au'){$('#e-em').textContent=ok?'':'Enter a valid email.';if(!ok)return;if(f.kind=='login'){if(!f.pw){$('#e-pw').textContent='Password is required.';return}toast('Demo sign-in, no real authentication');location.hash='#/dashboard'}else{$('#au-m').textContent='Demo only: no reset email was sent.'}}});
window.addEventListener('hashchange',()=>{UI.nav=false;UI.np=false;render();scrollTo(0,0)});render();
</script></body></html>
